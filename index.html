<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo - Cozy Anime Room Wallpaper</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0714;
      font-family: 'Comfortaa', 'Quicksand', cursive, sans-serif;
    }

    /* Fullscreen 16:9 Wallpaper Container */
    #wallpaper-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d0918;
    }

    #wallpaper-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
    }

    /* Ambient Subtle Room Glow & Breathing Filter */
    .ambient-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 65% 35%, rgba(244, 114, 182, 0.12), transparent 70%),
                  radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.08), transparent 50%);
      animation: ambient-breathe 8s ease-in-out infinite alternate;
    }

    @keyframes ambient-breathe {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* Ambient Dust & Sparkle Canvas */
    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Interactive Cat Hotspot (Bottom-Left) */
    #cat-hotspot {
      position: absolute;
      bottom: 2%;
      left: 7%;
      width: 30%;
      height: 36%;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      border-radius: 50%;
    }

    /* Tokyo Bubble / Text */
    #tokyo-badge {
      position: absolute;
      bottom: 27%;
      left: 21%;
      transform: translate(-50%, 0) scale(0);
      background: rgba(255, 255, 255, 0.94);
      color: #e11d48;
      font-size: clamp(18px, 2vw, 32px);
      font-weight: 700;
      padding: 8px 22px;
      border-radius: 9999px;
      box-shadow: 0 0 30px rgba(244, 114, 182, 0.8), 0 8px 20px rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(253, 164, 175, 0.95);
      pointer-events: none;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 1.5px;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    }

    #tokyo-badge.show {
      transform: translate(-50%, -15px) scale(1);
      opacity: 1;
    }

    /* Speech Bubble Pointer */
    #tokyo-badge::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.94) transparent;
      display: block;
      width: 0;
    }

    /* Floating Heart Bubbles Animation */
    .heart-bubble {
      position: absolute;
      pointer-events: none;
      z-index: 25;
      font-size: clamp(22px, 2.6vw, 42px);
      animation: float-heart 2.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      filter: drop-shadow(0 4px 12px rgba(244, 63, 94, 0.65));
    }

    @keyframes float-heart {
      0% {
        transform: translate(-50%, 0) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 1;
        transform: translate(calc(-50% + var(--rand-x) * 0.3), -25px) scale(1.15) rotate(var(--rand-rot));
      }
      60% {
        opacity: 0.95;
        transform: translate(calc(-50% + var(--rand-x)), -100px) scale(1) rotate(calc(var(--rand-rot) * -0.7));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--rand-x-2)), -190px) scale(0.8) rotate(var(--rand-rot));
      }
    }

    /* Sparkle Particle on Click */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 26;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fde047;
      box-shadow: 0 0 10px #fde047, 0 0 20px #f472b6;
      animation: sparkle-burst 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes sparkle-burst {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
      }
      50% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx) * 1.6), calc(-50% + var(--dy) * 1.6)) scale(0);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="wallpaper-container">
    <!-- Main 16:9 Wallpaper Background -->
    <img id="wallpaper-img" src="./wallpaper.jpg" alt="Cozy Anime Bedroom Wallpaper">

    <!-- Atmospheric Room Glow -->
    <div class="ambient-glow"></div>

    <!-- Floating Particles Canvas (Dust Motes & Magic Sparkles) -->
    <canvas id="particles-canvas"></canvas>

    <!-- Interactive Cat Hotspot (Bottom-Left) -->
    <div id="cat-hotspot" title="Tokyo 💖"></div>

    <!-- Tokyo Text Badge -->
    <div id="tokyo-badge">
      <span>Tokyo</span>
      <span style="font-size: 0.85em;">💖</span>
    </div>

    <!-- Heart Bubbles Container -->
    <div id="bubbles-container" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 25;"></div>
  </div>

  <script>
    // --- 1. TOKYO BADGE & HEART BUBBLES INTERACTION ---
    const catHotspot = document.getElementById('cat-hotspot');
    const tokyoBadge = document.getElementById('tokyo-badge');
    const bubblesContainer = document.getElementById('bubbles-container');
    let hideTimer = null;

    const HEARTS = ['💖', '💕', '💗', '💓', '🫧', '✨', '🐾'];

    function triggerTokyoEffect(e) {
      // 1. Show / Refresh "Tokyo" badge
      tokyoBadge.classList.add('show');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        tokyoBadge.classList.remove('show');
      }, 3500);

      // Get origin position (near cat center)
      const rect = catHotspot.getBoundingClientRect();
      const originX = rect.left + rect.width * 0.5;
      const originY = rect.top + rect.height * 0.45;

      // 2. Spawn Heart Bubbles
      const bubbleCount = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < bubbleCount; i++) {
        setTimeout(() => {
          createHeartBubble(originX, originY);
        }, i * 90);
      }

      // 3. Spawn Sparkles
      for (let i = 0; i < 10; i++) {
        createSparkle(originX, originY);
      }
    }

    function createHeartBubble(x, y) {
      const bubble = document.createElement('div');
      bubble.className = 'heart-bubble';
      bubble.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];

      const randX = (Math.random() - 0.5) * 120 + 'px';
      const randX2 = (Math.random() - 0.5) * 180 + 'px';
      const randRot = (Math.random() - 0.5) * 50 + 'deg';

      bubble.style.setProperty('--rand-x', randX);
      bubble.style.setProperty('--rand-x-2', randX2);
      bubble.style.setProperty('--rand-rot', randRot);

      // Random slight offset around the cat
      const startX = x + (Math.random() - 0.5) * 80;
      const startY = y + (Math.random() - 0.5) * 40;

      bubble.style.left = startX + 'px';
      bubble.style.top = startY + 'px';

      bubblesContainer.appendChild(bubble);
      setTimeout(() => bubble.remove(), 2500);
    }

    function createSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';

      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 55;
      const dx = Math.cos(angle) * dist + 'px';
      const dy = Math.sin(angle) * dist + 'px';

      sparkle.style.setProperty('--dx', dx);
      sparkle.style.setProperty('--dy', dy);
      sparkle.style.left = x + 'px';
      sparkle.style.top = y + 'px';

      bubblesContainer.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 1100);
    }

    catHotspot.addEventListener('click', triggerTokyoEffect);

    // --- 2. AMBIENT DUST & GLOW PARTICLES (CANVAS) ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class AmbientParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = -Math.random() * 0.45 - 0.1;
        this.opacity = Math.random() * 0.65 + 0.2;
        this.hue = Math.random() > 0.55 ? 330 : 45; // Lo-Fi Pink or Warm Golden
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 5;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 85%, 75%, ${this.opacity})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${this.hue}, 95%, 70%, 0.8)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new AmbientParticle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
